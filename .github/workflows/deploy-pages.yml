# Builds the site and publishes it to GitHub Pages on every push to main.
# Preview only: the pages are marked "noindex" so search engines skip them.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The site is served from https://<user>.github.io/<repo>/, so build for that folder.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/

      # GitHub Pages can't route every URL to the app, but it serves 404.html for
      # unknown paths: a copy of the page lets direct links and refreshes work.
      # Also hide the preview from search engines.
      - name: Prepare for GitHub Pages
        run: |
          sed -i 's|<head>|<head>\n    <meta name="robots" content="noindex, nofollow" />|' dist/index.html
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
